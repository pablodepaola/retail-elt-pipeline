version: 2

models:
  - name: int_order_items_enriched
    description: Line-level fact with real revenue and SYNTHETIC COGS/margin.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: revenue
        data_tests:
          - not_null
          - dbt_utils.accepted_range: { min_value: 0 }
      - name: gross_margin
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, order_item_id]

  - name: int_daily_product_sales
    description: Daily realized sales per product (valid statuses only).
    columns:
      - name: units_sold
        data_tests:
          - dbt_utils.accepted_range: { min_value: 0 }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_date, product_id]

  - name: int_inventory_position
    description: SYNTHETIC deterministic inventory ledger (product x date).
    columns:
      - name: on_hand_units
        data_tests:
          - not_null
          - dbt_utils.accepted_range: { min_value: 0 }
      - name: sell_through_rate
        data_tests:
          - dbt_utils.accepted_range: { min_value: 0, max_value: 1 }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [product_id, inv_date]
