version: 2

exposures:
  - name: oracle_apex_exec_dashboard
    label: "Merchandising & Finance Exec Dashboard (Oracle APEX)"
    type: dashboard
    maturity: high
    description: >
      Exec dashboard for the head of merchandising/finance. Reads the marts after
      they are published to Oracle Autonomous DB. Surfaces stockout risk, margin by
      category, sell-through, and a 'last refreshed / tests passing' status tile.
    depends_on:
      - ref('mart_exec_kpis')
      - ref('mart_sales_by_category')
      - ref('mart_inventory_health')
      - ref('mart_pipeline_status')
    owner:
      name: Pablo de Paola
