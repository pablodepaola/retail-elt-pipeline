name: CI

# PR gate: build the whole pipeline against the committed SAMPLE (no secrets,
# no Kaggle, no Oracle). Runs extract -> load -> Great Expectations -> dbt
# build + tests, plus the Python unit tests. Any failure blocks the PR.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DBT_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/retail.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.4

      - name: dbt deps
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Python unit tests
        run: pytest -q

      - name: Run full ELT on sample (extract+load+GE+dbt build+tests)
        run: python -m pipeline.cli --sample --target ci run --dry-run

      - name: dbt docs generate (catalog sanity)
        run: dbt docs generate --project-dir dbt --profiles-dir dbt --target ci

      - name: Upload mart exports (review artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mart-exports
          path: data/exports/*.csv
          if-no-files-found: ignore
