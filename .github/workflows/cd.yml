name: CD (scheduled pipeline)

# Production schedule. Restores the self-contained warehouse + watermark from the
# 'warehouse-latest' GitHub Release, runs the incremental pipeline (or a manual
# backfill), publishes marts to Oracle (if configured), then persists the updated
# warehouse back to the Release. 100% free: public-repo Actions minutes are free,
# state lives in Releases (no external storage).

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily (off the top of the hour on purpose)
  workflow_dispatch:
    inputs:
      command:
        description: "run (incremental) or backfill (explicit range)"
        type: choice
        options: [run, backfill]
        default: run
      start:
        description: "backfill start (YYYY-MM-DD)"
        required: false
      end:
        description: "backfill end (YYYY-MM-DD)"
        required: false
      full_refresh:
        description: "rebuild warehouse from scratch"
        type: boolean
        default: false

concurrency:
  group: cd-pipeline # serialize: never two writers to the warehouse at once
  cancel-in-progress: false

permissions:
  contents: write # needed to upload the warehouse to a Release

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DBT_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/retail.duckdb
      GH_TOKEN: ${{ github.token }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
      ORACLE_DSN: ${{ secrets.ORACLE_DSN }}
      ORACLE_WALLET_B64: ${{ secrets.ORACLE_WALLET_B64 }}
      ORACLE_WALLET_PASSWORD: ${{ secrets.ORACLE_WALLET_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          dbt deps --project-dir dbt --profiles-dir dbt

      - name: Restore warehouse + watermark from Release
        run: |
          mkdir -p data
          if gh release download warehouse-latest --pattern "state.tgz" --dir . ; then
            tar xzf state.tgz && rm -f state.tgz
            echo "restored prior warehouse state"
          else
            echo "no prior state (cold start)"
          fi

      - name: Optional full refresh (rebuild from scratch)
        if: ${{ inputs.full_refresh == true }}
        run: rm -rf data/warehouse data/raw pipeline/state/watermark.json

      - name: Acquire source data (Kaggle if configured, else committed sample)
        id: src
        run: |
          if [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then
            pip install kaggle
            kaggle datasets download -d olistbr/brazilian-ecommerce -p data/source --unzip
            echo "sample_flag=" >> "$GITHUB_OUTPUT"
            echo "using REAL Olist dataset from Kaggle"
          else
            echo "sample_flag=--sample" >> "$GITHUB_OUTPUT"
            echo "Kaggle secrets not set -> using committed sample"
          fi

      - name: Decode Oracle wallet (if publishing)
        id: ora
        run: |
          if [ -n "$ORACLE_USER" ] && [ -n "$ORACLE_WALLET_B64" ]; then
            mkdir -p oracle/wallet
            echo "$ORACLE_WALLET_B64" | base64 -d > oracle/wallet/wallet.zip
            unzip -o oracle/wallet/wallet.zip -d oracle/wallet >/dev/null
            echo "ORACLE_WALLET_DIR=$GITHUB_WORKSPACE/oracle/wallet" >> "$GITHUB_ENV"
            echo "publish_flag=--publish" >> "$GITHUB_OUTPUT"
            echo "Oracle publish ENABLED"
          else
            echo "publish_flag=--dry-run" >> "$GITHUB_OUTPUT"
            echo "Oracle secrets not set -> dry-run CSV export"
          fi

      - name: Run pipeline
        run: |
          SAMPLE="${{ steps.src.outputs.sample_flag }}"
          PUB="${{ steps.ora.outputs.publish_flag }}"
          CMD="${{ inputs.command || 'run' }}"
          if [ "$CMD" = "backfill" ]; then
            python -m pipeline.cli $SAMPLE --target prod backfill \
              --start "${{ inputs.start }}" --end "${{ inputs.end }}" $PUB
          else
            python -m pipeline.cli $SAMPLE --target prod run $PUB
          fi

      - name: Persist warehouse + watermark to Release
        if: ${{ always() }}
        run: |
          tar czf state.tgz data/raw data/warehouse pipeline/state || true
          gh release view warehouse-latest >/dev/null 2>&1 \
            || gh release create warehouse-latest --title "Warehouse state" \
                 --notes "Self-contained DuckDB warehouse + watermark (auto-updated)."
          gh release upload warehouse-latest state.tgz --clobber

      - name: Upload run artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts
          path: |
            data/exports/*.csv
            pipeline/state/watermark.json
          if-no-files-found: ignore
